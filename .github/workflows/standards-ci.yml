name: Standards CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ci:
    # Reusable workflow: tests with coverage and uploads to Codecov via OIDC.
    # Requires the repository to be activated on Codecov (gate G2); until then this job fails at the upload step.
    permissions:
      contents: read
      id-token: write
    uses: edithatogo/repository-standards/.github/workflows/python-ci.yml@ad67bedaa0c4d0769bd54fd76354bac65b25b88c # main 2026-09-05
    with:
      python-version: "3.11"
      install-command: python -m pip install -e . -r tests/requirements-dev.txt
      test-command: python -m coverage run --source=cli,mcp -m unittest discover -s tests -t . -p "test_*.py" && python -m coverage xml

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  supply-chain-evidence:
    # Inventory the checkout, then attest only uniquely named generated evidence.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: Generate checksums
        run: sha256sum sbom.spdx.json sbom.cyclonedx.json > CHECKSUMS.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            sbom.spdx.json
            sbom.cyclonedx.json
            CHECKSUMS.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence-${{ github.run_id }}
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
            CHECKSUMS.sha256
          retention-days: 90
