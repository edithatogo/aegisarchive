name: Standards CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ci:
    # Reusable workflow: tests with coverage and uploads to Codecov via OIDC.
    # Requires the repository to be activated on Codecov (gate G2); until then this job fails at the upload step.
    permissions:
      contents: read
      id-token: write
    uses: edithatogo/repository-standards/.github/workflows/python-ci.yml@ad67bedaa0c4d0769bd54fd76354bac65b25b88c # main 2026-09-05
    with:
      python-version: '3.15.2'
      install-command: python -m pip install -e . -r tests/requirements-dev.txt
      test-command: python -m coverage run --source=cli,mcp -m unittest discover -s tests -t . -p "test_*.py" && python -m coverage xml

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  supply-chain-evidence:
    # Inventory the checkout, then attest only uniquely named generated evidence.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: Generate checksums
        run: sha256sum sbom.spdx.json sbom.cyclonedx.json > CHECKSUMS.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            sbom.spdx.json
            sbom.cyclonedx.json
            CHECKSUMS.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-evidence-${{ github.run_id }}
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
            CHECKSUMS.sha256
          retention-days: 90
