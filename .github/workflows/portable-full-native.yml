name: Portable full native qualification
on:
  # Full native asset qualification is deliberately a manual/release gate.
  # Pull requests use the fast portable probe matrix instead of downloading
  # multi-gigabyte optional runtimes on every change.
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to qualify
        type: choice
        default: all
        options: [all, linux, windows, macos]
permissions:
  contents: read
concurrency:
  group: portable-full-native-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(
            inputs.platform == 'linux' && '["ubuntu-latest"]' ||
            inputs.platform == 'windows' && '["windows-latest"]' ||
            inputs.platform == 'macos' && '["macos-15"]' ||
            '["ubuntu-latest","windows-latest","macos-15"]'
          ) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reclaim unused hosted Linux SDKs for model bundle
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y patchelf zlib1g-dev
          df -h .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Write pinned licence and source inventory
        shell: bash
        run: python portable/provision_native.py --inventory artifacts/full-native/native-source-inventory.json
      - name: Stage pinned Bash source from HTTPS mirrors
        shell: bash
        continue-on-error: true
        run: python portable/prefetch_bash.py --work "$RUNNER_TEMP/aegis-full-native"
      - name: Provision pinned assets and qualify relocated offline bundle
        id: provision
        shell: bash
        continue-on-error: true
        run: python portable/provision_native.py --work "$RUNNER_TEMP/aegis-full-native" --output artifacts/full-native
      - name: Fail closed unless native qualification passed
        shell: bash
        run: python portable/check_native_receipt.py artifacts/full-native/native-qualification.json
      - name: Retain native receipts and provisioning logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-native-${{ matrix.os }}
          path: |
            artifacts/full-native/*
            ${{ runner.temp }}/aegis-full-native/*.log
            ${{ runner.temp }}/aegis-full-native/speech/*.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
