name: Portable full native qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reclaim unused hosted Linux SDKs for model bundle
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y patchelf zlib1g-dev
          df -h .
      - name: Write pinned licence and source inventory
        shell: bash
        run: python portable/provision_native.py --inventory artifacts/full-native/native-source-inventory.json
      - name: Provision pinned assets and qualify relocated offline bundle
        shell: bash
        run: python portable/provision_native.py --work "$RUNNER_TEMP/aegis-full-native" --output artifacts/full-native
      - name: Retain native receipts and provisioning logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-native-${{ matrix.os }}
          path: |
            artifacts/full-native/*
            ${{ runner.temp }}/aegis-full-native/*.log
            ${{ runner.temp }}/aegis-full-native/speech/*.log
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
