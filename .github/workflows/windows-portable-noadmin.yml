name: Windows portable no-admin acceptance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-noadmin:
    name: Portable path without admin services
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the USB embedded runtime
        shell: pwsh
        run: ./scripts/prepare_windows_runtime.ps1
      - name: Run portable acceptance
        shell: pwsh
        run: ./scripts/windows_portable_acceptance.ps1
