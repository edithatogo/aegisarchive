name: Windows portable no-admin acceptance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-noadmin:
    name: Portable path without admin services
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.15 for storage diagnostics
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Check Windows storage diagnostics and checkpoint recovery
        shell: pwsh
        run: |
          python -m venv .venv
          $testPython = Join-Path $PWD '.venv/Scripts/python.exe'
          $actualVersion = & $testPython -c 'import sys; print(".".join(map(str, sys.version_info[:3])))'
          if ($actualVersion -ne '3.15.2') { throw "Unexpected Python version: $actualVersion" }
          & $testPython -m unittest tests.test_capture_bridge.CaptureBridgeTests.test_checkpoint_windows_storage_error_retains_safe_diagnostic_and_checkpoint tests.test_capture_bridge.CaptureBridgeTests.test_storage_diagnostic_log_failure_does_not_hide_original_error -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows storage diagnostics regression failed' }
      - name: Prepare the USB embedded runtime
        shell: pwsh
        run: ./scripts/prepare_windows_runtime.ps1
      - name: Run portable acceptance
        shell: pwsh
        run: ./scripts/windows_portable_acceptance.ps1
