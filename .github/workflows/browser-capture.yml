name: Browser capture acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AEGIS_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os != 'Windows'
        with:
          python-version: '3.14'
      - name: Prepare and select USB Python on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/prepare_windows_runtime.ps1
          'AEGIS_TEST_PYTHON=runtime\python\python.exe' >> $env:GITHUB_ENV
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:capture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: capture-failure-${{ matrix.os }}
          path: test-results/
          retention-days: 7
