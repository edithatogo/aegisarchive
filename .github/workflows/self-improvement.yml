name: Self-Improvement Loop

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: self-improvement
  cancel-in-progress: false

jobs:
  audit:
    name: Claims & Track Health Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Baseline tests
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            git ls-files -z '*.py' | xargs -0 python -m py_compile &&
              python scripts/gate.py test
          } 2>&1 | tee baseline.txt
      - name: Claims and track health
        run: |
          python scripts/claims_audit.py --allow-fail > claims.md
          python scripts/track_health.py > health.md
      - name: Assemble report
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
        run: |
          {
            echo "# Self-improvement report"
            echo
            echo "Source revision $GITHUB_SHA"
            echo
            echo "Baseline tests $BASELINE_OUTCOME. Full test output is in the report artifact."
            echo
            cat claims.md health.md
          } > self-improvement.md
          cat self-improvement.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-improvement-${{ github.sha }}
          path: |
            self-improvement.md
            baseline.txt
          if-no-files-found: error
          retention-days: 30
      - name: Require baseline success
        if: steps.baseline.outcome == 'failure'
        run: exit 1
