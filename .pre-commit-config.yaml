minimum_pre_commit_version: "4.7.0"
repos:
  - repo: local
    hooks:
      - id: staged-whitespace
        name: Check staged whitespace
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: Gitleaks staged secret scan
        entry: gitleaks git --staged --redact=100 --no-banner --config=.gitleaks.toml
        language: system
        pass_filenames: false
        always_run: true
      - id: actionlint
        name: Lint changed GitHub Actions workflows
        entry: actionlint
        language: system
        files: '^\.github/workflows/[^/]+\.ya?ml$'
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.8.0
    hooks:
      - id: eslint
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
